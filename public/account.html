<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="View your Farming Collection account and profile details." name="description"/>
  <title>
   My Account | Farming Collection
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Roboto:wght@500;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
 </head>
 <body class="fc-account-page">
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm py-3 px-3 px-lg-5">
   <a class="navbar-brand d-lg-none" href="/index.html">
    <span class="h4 text-white">
     Farming
     <span class="text-secondary">
      Collection
     </span>
    </span>
   </a>
   <button aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbarCollapse" data-bs-toggle="collapse" type="button">
    <span class="navbar-toggler-icon">
    </span>
   </button>
   <div class="collapse navbar-collapse" id="navbarCollapse">
    <div class="navbar-nav mx-auto py-0">
    </div>
   </div>
  </nav>
  <main class="container py-5">
   <div class="fc-account-heading text-center mb-4">
    <span class="fc-eyebrow">
     YOUR ACCOUNT
    </span>
    <h1 class="display-6 mt-2">
     My Profile
    </h1>
    <p class="text-muted mb-0">
     Your personal and contact details linked to Farming Collection.
    </p>
   </div>
   <section class="fc-account-card mx-auto">
    <div class="fc-account-card-head">
     <div class="fc-account-avatar">
      <i aria-hidden="true" class="bi bi-person-fill">
      </i>
     </div>
     <div>
      <h2 class="h4 mb-1" id="account-name">
       Loading profile...
      </h2>
      <p class="text-muted mb-0" id="account-email">
      </p>
     </div>
    </div>
    <div aria-live="polite" class="row g-3 mt-2" id="account-details">
     <div class="col-12">
      <div class="fc-account-loading">
       Loading your account details…
      </div>
     </div>
    </div>
    <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
     <a class="btn btn-outline-primary" href="/index.html">
      <i class="bi bi-house me-1">
      </i>
      Home
     </a>
     <a class="btn btn-primary" href="/profile-setup.html">
      <i class="bi bi-pencil-square me-1">
      </i>
      Edit Profile
     </a>
    </div>
    <p class="alert alert-danger mt-3 mb-0" hidden="" id="account-error" role="alert">
    </p>
   </section>
  </main>
  <script defer="" src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js">
  </script>
  <script defer="" src="/js/main.js">
  </script>
  <script defer="" src="/js/account.js">
  </script>
 </body>
</html>
