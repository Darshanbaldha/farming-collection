<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="Complete your Farming Collection profile and delivery details." name="description"/>
  <title>
   Complete Your Profile | Farming Collection
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;family=Roboto:wght@500;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
 </head>
 <body class="fc-profile-page">
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm py-3 px-3 px-lg-5">
   <a class="navbar-brand d-lg-none" href="/index.html">
    <span class="h4 text-white">
     Farming
     <span class="text-secondary">
      Collection
     </span>
    </span>
   </a>
   <button aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbarCollapse" data-bs-toggle="collapse" type="button">
    <span class="navbar-toggler-icon">
    </span>
   </button>
   <div class="collapse navbar-collapse" id="navbarCollapse">
    <div class="navbar-nav mx-auto py-0">
    </div>
   </div>
  </nav>
  <main class="container py-4 py-lg-5">
   <div class="row justify-content-center">
    <div class="col-lg-9 col-xl-8">
     <section class="fc-profile-card">
      <div class="text-center mb-4">
       <span class="fc-eyebrow">
        ONE LAST STEP
       </span>
       <h1 class="display-6 mt-2">
        Complete your profile
       </h1>
       <p class="text-muted">
        Add your contact and address details to make buying and selling easier.
       </p>
      </div>
      <form class="row g-3" id="profile-form">
       <div class="col-md-6">
        <label class="form-label" for="profile-name">
         Full name *
        </label>
        <input autocomplete="name" class="form-control" id="profile-name" maxlength="80" name="name" required=""/>
       </div>
       <div class="col-md-6">
        <label class="form-label" for="profile-mobile">
         Mobile number *
        </label>
        <input autocomplete="tel" class="form-control" id="profile-mobile" name="mobileNumber" pattern="[0-9+()\-\s]{10,15}" placeholder="10-digit mobile number" required="" type="tel"/>
       </div>
       <div class="col-12">
        <label class="form-label" for="profile-address">
         Home / delivery address *
        </label>
        <textarea autocomplete="street-address" class="form-control" id="profile-address" maxlength="250" name="address" required="" rows="2"></textarea>
       </div>
       <div class="col-12">
        <label class="form-label" for="profile-farm">
         Farm address (if applicable)
        </label>
        <textarea class="form-control" id="profile-farm" maxlength="250" name="farmAddress" placeholder="Enter your farm address if you are a farmer" rows="2"></textarea>
       </div>
       <div class="col-md-5">
        <label class="form-label" for="profile-state">
         State *
        </label>
        <input autocomplete="address-level1" class="form-control" id="profile-state" maxlength="80" name="state" required=""/>
       </div>
       <div class="col-md-4">
        <label class="form-label" for="profile-city">
         City / District
        </label>
        <input autocomplete="address-level2" class="form-control" id="profile-city" maxlength="80" name="city"/>
       </div>
       <div class="col-md-3">
        <label class="form-label" for="profile-pincode">
         PIN code *
        </label>
        <input autocomplete="postal-code" class="form-control" id="profile-pincode" inputmode="numeric" maxlength="6" name="pincode" pattern="[0-9]{6}" required=""/>
       </div>
       <div class="col-12">
        <p class="small text-muted mb-0">
         Your email address is linked to your account and does not need to be entered again.
        </p>
       </div>
       <div class="col-12 d-flex flex-wrap gap-2 justify-content-between align-items-center mt-4">
        <a class="btn btn-outline-secondary" href="/index.html">
         Back to Home
        </a>
        <button class="btn btn-primary px-4" type="submit">
         Save Details &amp; Continue
         <i class="bi bi-arrow-right ms-2">
         </i>
        </button>
       </div>
       <p class="text-danger mb-0" hidden="" id="profile-error" role="alert">
       </p>
      </form>
     </section>
    </div>
   </div>
  </main>
  <script defer="" src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js">
  </script>
  <script defer="" src="/js/main.js">
  </script>
  <script defer="" src="/js/profile.js">
  </script>
 </body>
</html>
