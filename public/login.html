<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Log In | Farming Collection
  </title>
  <link href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&amp;family=Roboto:wght@500;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm py-3 px-3 px-lg-5">
   <a class="navbar-brand d-lg-none" href="/index.html">
    <span class="h4 text-white">
     Farming
     <span class="text-secondary">
      Collection
     </span>
    </span>
   </a>
   <button aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbarCollapse" data-bs-toggle="collapse" type="button">
    <span class="navbar-toggler-icon">
    </span>
   </button>
   <div class="collapse navbar-collapse" id="navbarCollapse">
    <div class="navbar-nav mx-auto py-0">
    </div>
   </div>
  </nav>
  <div class="container-fluid py-5 auth-page">
   <div class="text-center mb-4">
    <a class="text-decoration-none" href="/index.html">
     <h2 class="text-primary fw-bold">
      Farming Collection
     </h2>
    </a>
    <p class="text-muted">
     Welcome back. Log in to continue.
    </p>
   </div>
   <div class="container">
    <div class="d-flex justify-content-center">
     <div class="col-lg-7">
      <div class="bg-primary h-100 p-5">
       <form action="/api/login" class="api-form auth-form" method="post">
        <h3 class="text-white mb-4 text-center">
         Log In
        </h3>
        <div class="row g-3">
         <div class="col-12">
          <input autocomplete="email" class="form-control bg-light px-4 mybtn" maxlength="254" name="email" placeholder="Your Email" required="" style="height: 55px" type="email"/>
         </div>
         <div class="col-12">
          <input autocomplete="new-password" class="form-control bg-light px-4 mybtn" minlength="8" name="password" placeholder="Your Password" required="" style="height: 55px" type="password"/>
         </div>
         <div class="col-12">
          <button class="btn btn-secondary w-100 py-3 mybtn" type="submit">
           Log In
          </button>
         </div>
        </div>
       </form>
       <p class="text-center text-white mt-4 mb-0">
        New to Farming Collection?
        <a class="text-white fw-bold" href="/signup.html">
         Create an account
        </a>
       </p>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script defer="" src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js">
  </script>
  <script defer="" src="/js/main.js">
  </script>
  <script defer="" src="/js/marketplace.js">
  </script>
  <script>
   if (new URLSearchParams(location.search).get("registered") === "1") { const note=document.createElement("div"); note.className="alert alert-success text-center"; note.textContent="Account created successfully. Please log in."; document.querySelector(".auth-page .container")?.prepend(note); }
  </script>
 </body>
</html>
